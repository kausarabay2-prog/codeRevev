<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Item</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <!-- ADD -->

    <div th:if="${item == null}">

        <h1 class="mb-4">
            Add Item
        </h1>


        <form
                th:action="@{/items/add}"
                method="post">

            <div class="mb-3">

                <label class="form-label">
                    Item name
                </label>

                <input
                        type="text"
                        name="name"
                        class="form-control"
                        required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Price
                </label>

                <input
                        type="number"
                        name="price"
                        class="form-control"
                        required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Country
                </label>

                <select
                        name="country"
                        class="form-select"
                        required>

                    <option value="">
                        Select country
                    </option>

                    <option
                            th:each="country : ${countries}"
                            th:value="${country.id}"
                            th:text="${country.name}">
                    </option>

                </select>

            </div>


            <button
                    type="submit"
                    class="btn btn-success">

                Add

            </button>


            <a
                    href="/items"
                    class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>


    <!-- DETAIL + UPDATE -->

    <div th:if="${item != null}">

        <h1 class="mb-4">
            Item Details
        </h1>


        <form
                th:action="@{/items/update}"
                method="post">

            <input
                    type="hidden"
                    name="id"
                    th:value="${item.id}">


            <div class="mb-3">

                <label class="form-label">
                    Item name
                </label>

                <input
                        type="text"
                        name="name"
                        class="form-control"
                        th:value="${item.nameItem}"
                        required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Price
                </label>

                <input
                        type="number"
                        name="price"
                        class="form-control"
                        th:value="${item.priceItem}"
                        required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Country
                </label>

                <select
                        name="country"
                        class="form-select"
                        required>

                    <option
                            th:each="country : ${countries}"
                            th:value="${country.id}"
                            th:text="${country.name}"
                            th:selected="${item.country != null and item.country.id == country.id}">
                    </option>

                </select>

            </div>


            <button
                    type="submit"
                    class="btn btn-warning">

                Update

            </button>


            <a
                    href="/items"
                    class="btn btn-secondary">

                Back

            </a>

        </form>


        <!-- DELETE -->

        <form
                th:action="@{/items/delete}"
                method="post"
                class="mt-3">

            <input
                    type="hidden"
                    name="id"
                    th:value="${item.id}">

            <button
                    type="submit"
                    class="btn btn-danger"
                    onclick="return confirm('Delete this item?')">

                Delete

            </button>

        </form>

    </div>

</div>

</body>

</html>
