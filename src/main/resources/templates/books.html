<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Books</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        Books
    </h1>


    <a
            href="/books/add"
            class="btn btn-success mb-4">

        Add Book

    </a>


    <a
            href="/libraries"
            class="btn btn-dark mb-4">

        Libraries

    </a>


    <table class="table table-bordered table-hover">

        <thead>

        <tr>

            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Library</th>
            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="book : ${books}">

            <td th:text="${book.id}">
            </td>

            <td th:text="${book.title}">
            </td>

            <td th:text="${book.author}">
            </td>

            <td th:text="${book.price}">
            </td>

            <td
                    th:text="${book.library != null ? book.library.name : 'No library'}">
            </td>

            <td>

                <a
                        th:href="@{/books/{id}(id=${book.id})}"
                        class="btn btn-primary btn-sm">

                    Details

                </a>


                <form
                        th:action="@{/books/delete}"
                        method="post"
                        style="display:inline">

                    <input
                            type="hidden"
                            name="id"
                            th:value="${book.id}">

                    <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete book?')">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
