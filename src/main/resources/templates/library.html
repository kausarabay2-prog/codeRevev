<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Library Details</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="col-md-6">

        <h1 class="mb-4">
            Library Details
        </h1>


        <form
                th:action="@{/libraries/update}"
                method="post">

            <input
                    type="hidden"
                    name="id"
                    th:value="${library.id}">


            <label class="form-label">
                Name
            </label>

            <input
                    type="text"
                    name="name"
                    class="form-control mb-3"
                    th:value="${library.name}"
                    required>


            <label class="form-label">
                Address
            </label>

            <input
                    type="text"
                    name="address"
                    class="form-control mb-3"
                    th:value="${library.address}"
                    required>


            <button
                    type="submit"
                    class="btn btn-warning">

                Update

            </button>


            <a
                    href="/libraries"
                    class="btn btn-secondary">

                Back

            </a>

        </form>



        <form
                th:action="@{/libraries/delete}"
                method="post"
                class="mt-3">

            <input
                    type="hidden"
                    name="id"
                    th:value="${library.id}">

            <button
                    type="submit"
                    class="btn btn-danger"
                    onclick="return confirm('Delete library?')">

                Delete

            </button>

        </form>

    </div>

</div>

</body>
</html>
