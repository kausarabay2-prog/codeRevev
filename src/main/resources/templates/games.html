
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Game Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 30px;
            gap: 25px;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 8px #ddd;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .search {
            flex: 1;
            padding: 13px 20px;
            border: none;
            border-radius: 25px;
            background: #eeeeee;
            font-size: 16px;
            outline: none;
        }

        .add-button {
            background: black;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 22px;
        }

        .container {
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .games {
            columns: 4 220px;
            column-gap: 20px;
        }

        .game {
            background: white;
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            break-inside: avoid;
            box-shadow: 0 2px 8px #ddd;
            transition: 0.2s;
        }

        .game:hover {
            transform: translateY(-5px);
        }

        .game-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .game-info {
            padding: 16px;
        }

        .game-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .genre {
            color: #777;
            margin-bottom: 8px;
        }

        .developer {
            font-size: 14px;
            color: #999;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-top: 12px;
        }

        .details {
            display: block;
            margin-top: 15px;
            text-align: center;
            padding: 10px;
            background: #eeeeee;
            color: black;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">
         GameStore
    </div>

    <input class="search"
           type="text"
           placeholder="Search games...">

    <a href="/games/add" class="add-button">
        + Add Game
    </a>

</div>


<div class="container">

    <h1>Explore Games 🎮</h1>

    <div class="games">

        <div class="game" th:each="game : ${games}">

            <img class="game-image"
                 th:src="${game.imageUrl}"
                 alt="Game image">

            <div class="game-info">

                <div class="game-name"
                     th:text="${game.name}">
                    Game Name
                </div>

                <div class="genre"
                     th:text="${game.genre}">
                    Action
                </div>

                <div class="developer"
                     th:text="${game.developer}">
                    Developer
                </div>

                <div class="price">
                    $<span th:text="${game.price}">20</span>
                </div>

                <a class="details"
                   th:href="@{'/games/' + ${game.id}}">
                    View Details
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
