<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Product</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card">

        <div class="card-header">

            <h2>Add Product</h2>

        </div>

        <div class="card-body">

            <form
                    th:action="@{/products/add}"
                    th:object="${product}"
                    method="post">


                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input
                            type="text"
                            th:field="*{name}"
                            class="form-control"
                            required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Brand
                    </label>

                    <input
                            type="text"
                            th:field="*{brand}"
                            class="form-control"
                            required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Price
                    </label>

                    <input
                            type="number"
                            step="0.01"
                            th:field="*{price}"
                            class="form-control"
                            required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Quantity
                    </label>

                    <input
                            type="number"
                            th:field="*{quantity}"
                            class="form-control"
                            required>

                </div>


                <button
                        type="submit"
                        class="btn btn-success">

                    Add Product

                </button>


                <a
                        href="/products"
                        class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
