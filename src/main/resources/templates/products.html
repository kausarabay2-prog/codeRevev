<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Products</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h1>Products</h1>

        <a
                href="/products/add"
                class="btn btn-success">

            + Add Product

        </a>

    </div>


    <!-- SEARCH -->

    <form
            action="/products/search"
            method="get"
            class="row mb-3">

        <div class="col-md-8">

            <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Search by name">

        </div>

        <div class="col-md-4">

            <button
                    type="submit"
                    class="btn btn-primary">

                Search

            </button>

            <a
                    href="/products"
                    class="btn btn-secondary">

                Reset

            </a>

        </div>

    </form>


    <!-- PRICE FILTER -->

    <form
            action="/products/filter"
            method="get"
            class="row mb-4">

        <div class="col-md-4">

            <input
                    type="number"
                    name="min"
                    class="form-control"
                    placeholder="Minimum price">

        </div>

        <div class="col-md-4">

            <input
                    type="number"
                    name="max"
                    class="form-control"
                    placeholder="Maximum price">

        </div>

        <div class="col-md-4">

            <button
                    type="submit"
                    class="btn btn-dark">

                Filter

            </button>

        </div>

    </form>


    <!-- TABLE -->

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Brand</th>

            <th>Price</th>

            <th>Quantity</th>

            <th>Status</th>

            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="product : ${products}">

            <td th:text="${product.id}">
                1
            </td>

            <td th:text="${product.name}">
                iPhone 15
            </td>

            <td th:text="${product.brand}">
                Apple
            </td>

            <td th:text="${product.price}">
                450000
            </td>

            <td th:text="${product.quantity}">
                10
            </td>

            <td>

                <span
                        th:if="${product.quantity > 0}"
                        class="badge bg-success">

                    IN STOCK

                </span>

                <span
                        th:if="${product.quantity == 0}"
                        class="badge bg-danger">

                    OUT OF STOCK

                </span>

            </td>

            <td>

                <a
                        th:href="@{/products/{id}(id=${product.id})}"
                        class="btn btn-info btn-sm">

                    Details

                </a>

                <a
                        th:href="@{/products/{id}/edit(id=${product.id})}"
                        class="btn btn-warning btn-sm">

                    Edit

                </a>

                <form
                        th:action="@{/products/{id}/delete(id=${product.id})}"
                        method="post"
                        style="display:inline;">

                    <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this product?')">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
