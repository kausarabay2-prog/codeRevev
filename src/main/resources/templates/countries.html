<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Countries</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        Countries
    </h1>


    <!-- ADD COUNTRY -->

    <div class="card mb-4">

        <div class="card-body">

            <h4>
                Add Country
            </h4>

            <form
                    th:action="@{/country/add}"
                    method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Country name
                    </label>

                    <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Kazakhstan"
                            required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Country code
                    </label>

                    <input
                            type="text"
                            name="code"
                            class="form-control"
                            placeholder="KZ"
                            required>

                </div>


                <button
                        type="submit"
                        class="btn btn-success">

                    Add

                </button>

            </form>

        </div>

    </div>


    <!-- COUNTRY LIST -->

    <table class="table table-bordered table-hover">

        <thead>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Code</th>
            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="country : ${countries}">

            <td th:text="${country.id}">
            </td>

            <td>

                <a
                        th:href="@{/country/{id}(id=${country.id})}"
                        th:text="${country.name}">

                </a>

            </td>

            <td th:text="${country.code}">
            </td>

            <td>

                <a
                        th:href="@{/country/{id}(id=${country.id})}"
                        class="btn btn-primary btn-sm">

                    Details

                </a>


                <form
                        th:action="@{/country/delete}"
                        method="post"
                        style="display:inline;">

                    <input
                            type="hidden"
                            name="id"
                            th:value="${country.id}">

                    <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this country?')">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
