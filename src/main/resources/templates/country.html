<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Country Details</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="col-md-6">

        <h1 class="mb-4">
            Country Details
        </h1>


        <form
                th:action="@{/country/update}"
                method="post">

            <input
                    type="hidden"
                    name="id"
                    th:value="${country.id}">


            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input
                        type="text"
                        name="name"
                        class="form-control"
                        th:value="${country.name}"
                        required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Code
                </label>

                <input
                        type="text"
                        name="code"
                        class="form-control"
                        th:value="${country.code}"
                        required>

            </div>


            <button
                    type="submit"
                    class="btn btn-warning">

                Update

            </button>


            <a
                    href="/country"
                    class="btn btn-secondary">

                Back

            </a>

        </form>


        <form
                th:action="@{/country/delete}"
                method="post"
                class="mt-3">

            <input
                    type="hidden"
                    name="id"
                    th:value="${country.id}">

            <button
                    type="submit"
                    class="btn btn-danger">

                Delete

            </button>

        </form>

    </div>

</div>

</body>

</html>
