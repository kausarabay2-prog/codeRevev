<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Libraries</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        Libraries
    </h1>




    <div class="card mb-4">

        <div class="card-body">

            <h4>
                Add Library
            </h4>

            <form
                    th:action="@{/libraries/add}"
                    method="post">

                <input
                        type="text"
                        name="name"
                        class="form-control mb-3"
                        placeholder="Library name"
                        required>


                <input
                        type="text"
                        name="address"
                        class="form-control mb-3"
                        placeholder="Address"
                        required>


                <button
                        type="submit"
                        class="btn btn-success">

                    Add

                </button>

            </form>

        </div>

    </div>



    <table class="table table-bordered table-hover">

        <thead>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="library : ${libraries}">

            <td th:text="${library.id}">
            </td>

            <td th:text="${library.name}">
            </td>

            <td th:text="${library.address}">
            </td>

            <td>

                <a
                        th:href="@{/libraries/{id}(id=${library.id})}"
                        class="btn btn-primary btn-sm">

                    Details

                </a>


                <form
                        th:action="@{/libraries/delete}"
                        method="post"
                        style="display:inline">

                    <input
                            type="hidden"
                            name="id"
                            th:value="${library.id}">

                    <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete library?')">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <a
            href="/books"
            class="btn btn-dark">

        Books

    </a>

</div>

</body>
</html>
