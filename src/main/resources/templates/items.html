<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Items</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        Items
    </h1>


    <a
            href="/items/add"
            class="btn btn-success mb-4">

        Add Item

    </a>


    <table class="table table-bordered table-hover">

        <thead>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Country</th>
            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="item : ${items}">

            <td th:text="${item.id}">
            </td>

            <td th:text="${item.nameItem}">
            </td>

            <td th:text="${item.priceItem}">
            </td>

            <td
                    th:text="${item.country != null ? item.country.name : 'No country'}">
            </td>

            <td>

                <a
                        th:href="@{/items/{id}(id=${item.id})}"
                        class="btn btn-primary btn-sm">

                    Details

                </a>


                <form
                        th:action="@{/items/delete}"
                        method="post"
                        style="display:inline;">

                    <input
                            type="hidden"
                            name="id"
                            th:value="${item.id}">

                    <button
                            type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this item?')">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
